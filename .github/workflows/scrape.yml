name: Scraper semanal de autoridades

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y navegador
        run: npm install

      - name: Scrapear ministros
        run: npm run scrape:ministros

      - name: Scrapear directorio nacional (todas las entidades)
        run: node scrape-directorio-nacional.js 50

      - name: Publicar ministros (automatico)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node upload-to-firestore.js ./output/ministros.json

      - name: Publicar directorio nacional (automatico)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node upload-to-firestore.js ./output/directorio-nacional.json

      - name: Guardar debug HTML si el scraper fallo en encontrar tarjetas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scraper/output/
          retention-days: 7
